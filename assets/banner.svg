<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".1"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}}@keyframes float{0%{transform:translateY(0)}}.glow-pulse{animation:pulse 3s infinite alternate ease-in-out}.float-card{animation:float 4s infinite alternate ease-in-out}.dash-flow{stroke-dasharray:8 8;animation:dash 20s linear infinite}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g opacity=".35"><line x1="100" x2="300" y1="50" y2="120" stroke="#38bdf8" stroke-width="1.5" class="dash-flow"/><line x1="300" x2="500" y1="120" y2="60" stroke="#818cf8" stroke-width="1.5" class="dash-flow"/><line x1="500" x2="800" y1="60" y2="150" stroke="#c084fc" stroke-width="1.5" class="dash-flow"/><line x1="800" x2="1100" y1="150" y2="80" stroke="#38bdf8" stroke-width="1.5" class="dash-flow"/><line x1="200" x2="450" y1="250" y2="200" stroke="#818cf8" stroke-width="1.5" class="dash-flow"/><line x1="450" x2="950" y1="200" y2="240" stroke="#c084fc" stroke-width="1.5" class="dash-flow"/><circle cx="300" cy="120" r="6" fill="#38bdf8" class="glow-pulse"/><circle cx="500" cy="60" r="8" fill="#818cf8" class="glow-pulse"/><circle cx="800" cy="150" r="5" fill="#c084fc" class="glow-pulse"/><circle cx="450" cy="200" r="7" fill="#38bdf8" class="glow-pulse"/></g><g class="float-card" opacity=".4"><rect width="140" height="